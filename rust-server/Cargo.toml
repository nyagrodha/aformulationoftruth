[package]
name = "aformulationoftruth-gate"
version = "0.1.0"
edition = "2021"
description = "age-encrypting gate service for a formulation of truth. Receives gate answers over HTTP, encrypts each one with the configured x25519 recipient, and persists the ASCII-armored ciphertext."

[[bin]]
name = "aformulationoftruth-gate"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "tokio"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
age = { version = "0.11", features = ["armor"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
