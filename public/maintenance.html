<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>aformulationoftruth.com</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-simple-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-simple-16.png">

  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    /* Base page chaos */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: url('/assets/thereisnogod.JPG') center/cover no-repeat fixed;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
    }

    .container {
      max-width: 700px;
      margin: 5% auto;
      padding: 1rem;
      text-align: center;
      background: none;
      animation: dissolve 18s ease-in 4s forwards;
    }

    @keyframes border-flash {
      0% { border-color: #ff00ff; }
      25% { border-color: #00ffff; }
      50% { border-color: #ffff00; }
      75% { border-color: #ff6600; }
      100% { border-color: #ff00ff; }
    }

    h1 {
      font-size: 2.5rem;
      text-shadow: 3px 3px #ff0000, -3px -3px #00ffff;
      animation: text-pulse 1s infinite alternate;
    }

    @keyframes text-pulse {
      0% { color: #ff00ff; }
      50% { color: #00ff00; }
      100% { color: #ffff00; }
    }

    p {
      font-size: 1.3rem;
      color: #00ffff;
      text-shadow: 0 0 10px #ff00ff;
    }

    /* Bhairava Section */
    .bhairava-section {
      margin-top: 2rem;
      text-align: center;
      background: none;
      padding: 1rem;
    }

    .bhairava-om {
      font-size: 2.5rem;
      font-family: 'Noto Serif Devanagari', serif;
      font-weight: bold;
      color: #ff00ff;
      text-shadow:
        2px 2px 0 #00ffff,
        -2px -2px 0 #ffff00,
        0 0 15px #ff0000;
      animation: colorflash 1s infinite;
    }

    @keyframes colorflash {
      0% { color: #ff00ff; }
      25% { color: #00ffff; }
      50% { color: #ffff00; }
      75% { color: #00ff00; }
      100% { color: #ff00ff; }
    }

    /* Video */
    /* YouTube shrunk to a small icon pinned to the lower-right corner */
    .bhairava-video {
      position: fixed;
      right: 14px;
      bottom: 14px;
      width: 132px;
      height: 74px;
      border: none;
      z-index: 5;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }
    .bhairava-video:hover { opacity: 1; }

    /* Projected echo of the title, cast beneath it */
    .projection {
      font-size: 2.6vw;
      margin-top: 2vh;
      opacity: 0.72;
      filter: blur(0.5px);
      text-shadow: 0 0 14px rgba(0,255,255,0.4), 0 0 30px rgba(255,0,255,0.25);
      transform: perspective(420px) rotateX(34deg) scaleY(0.9);
      transform-origin: top center;
      letter-spacing: 0.12vw;
      animation: colorShiftReverse 8s ease-in-out infinite reverse, projFlicker 6s steps(1, end) infinite;
    }

    @keyframes projFlicker {
      0%, 46%, 54%, 100% { opacity: 0.72; }
      48% { opacity: 0.5; }
      50% { opacity: 0.96; }
      52% { opacity: 0.58; }
    }

    /* "redial" — a live link back to the site (bookmark it: right-click -> Bookmark Link) */
    .projection a.redial {
      color: #00ffff;
      -webkit-text-fill-color: #00ffff;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-shadow: 0 0 10px rgba(0,255,255,0.95), 0 0 22px rgba(255,0,255,0.5);
      animation: redialPulse 1.6s ease-in-out infinite;
    }

    @keyframes redialPulse {
      0%, 100% { text-shadow: 0 0 8px rgba(0,255,255,0.7); }
      50%      { text-shadow: 0 0 16px rgba(0,255,255,1), 0 0 30px rgba(255,0,255,0.7); }
    }

    /* Small dial-tone hint under the projection */
    .dialhint {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      color: #7fdfff;
      opacity: 0.6;
      margin-top: 0.4rem;
      text-shadow: 0 0 6px rgba(0,255,255,0.4);
    }

    /* Flying salmon */
    .salmon {
      position: absolute;
      left: 0;
      width: 150px;
      pointer-events: none;
      z-index: 3;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.55));
      animation: swim 16s linear infinite;
      will-change: transform;
    }

    /* Swim left-to-right with a gentle bob and tail-driven wobble */
    @keyframes swim {
      0%   { transform: translate(-220px, 0)    rotate(-4deg); }
      25%  { transform: translate(30vw, -22px)  rotate(3deg); }
      50%  { transform: translate(58vw, 14px)   rotate(-3deg); }
      75%  { transform: translate(84vw, -14px)  rotate(4deg); }
      100% { transform: translate(112vw, 0)     rotate(-4deg); }
    }

    /* When pigs fly */
    .pig {
      position: absolute;
      left: 0;
      width: 130px;
      pointer-events: none;
      z-index: 3;
      filter: drop-shadow(0 0 14px rgba(255,120,180,0.55)) drop-shadow(0 8px 12px rgba(0,0,0,0.5));
      animation: flypig 24s linear infinite;
      will-change: transform;
    }

    @keyframes flypig {
      0%   { transform: translate(-200px, 8vh)  rotate(-8deg); }
      30%  { transform: translate(40vw, -4vh)   rotate(6deg); }
      60%  { transform: translate(70vw, 6vh)    rotate(-6deg); }
      100% { transform: translate(120vw, -2vh)  rotate(8deg); }
    }

    /* All the words dissolve after a readable pause, leaving only the background */
    @keyframes dissolve {
      0%   { opacity: 1; }
      40%  { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      .salmon, .pig { animation: none; }
      .container { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>this space is taking shape</h1>
    <p class="projection">these [ideas] are shaping space. please put us on <a class="redial" href="https://aformulationoftruth.com/" title="right-click → Bookmark Link (or press Ctrl / ⌘-D) to save our number">redial</a> 🔜</p>
    <p class="dialhint">☎ right-click “redial” → Bookmark Link, or press Ctrl / ⌘-D</p>

    <div class="bhairava-section">
      <p class="bhairava-om">
        <marquee behavior="alternate" scrollamount="8">
          🌸 ॐ कालभैरवाय नमः 🌸
        </marquee>
      </p>
    </div>
  </div>

  <!-- YouTube shrunk to a persistent corner icon (outside .container so it survives the dissolve) -->
  <iframe class="bhairava-video" src="https://www.youtube-nocookie.com/embed/1EdUjlawLJM?si=27wHing8BBkiQT4S" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  <!-- Flying salmon -->
  <img src="/assets/salmon.png" alt="flying salmon" class="salmon" style="top:8%;  animation-delay: 0s;   animation-duration: 17s;">
  <img src="/assets/salmon.png" alt="flying salmon" class="salmon" style="top:34%; animation-delay: -6s;  animation-duration: 21s;">
  <img src="/assets/salmon.png" alt="flying salmon" class="salmon" style="top:62%; animation-delay: -12s; animation-duration: 15s;">

  <!-- A single flying pig -->
  <img src="/assets/pig.png" alt="flying pig" class="pig" style="top:20%; animation-delay: -3s;">
</body>
</html>
