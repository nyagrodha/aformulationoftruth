name: CI

on:
  push:
    branches: [main, dev, prod]
  pull_request:
    branches: [main, dev, prod]

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Style checks are advisory for now: some forward-ported files still use
      # double quotes while deno.json enforces singleQuote. Not merge-blocking;
      # run `deno fmt` locally to clear them.
      - name: Format check (advisory)
        continue-on-error: true
        run: deno fmt --check

      - name: Lint (advisory)
        continue-on-error: true
        run: deno lint

      # Merge-gating: type-check the Fresh app through its entrypoints. main.ts
      # imports fresh.gen.ts, which imports every route/island (incl. the lotto
      # and messenger routes), so this validates the whole app graph compiles.
      - name: Type check
        run: deno check main.ts dev.ts

      - name: Test
        run: deno task test
