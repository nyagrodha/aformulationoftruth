name: CI

# The site is a Deno Fresh application. The previous pipeline ran `npm ci`
# against an Express server (`backend/`) that has since been deleted, watched
# branches (main, develop) that are not the deploy branch, and had been failing
# on every run. This replaces it with checks against the code that actually ships.

on:
  push:
    branches: [production, main]
  pull_request:
    branches: [production, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # Reinstated deliberately. 8ca0131 resolved this file's committed merge
    # conflict by discarding a Postgres service, and was right to: no test in
    # the step below touched a database, and it said so -- "reinstating a
    # database service belongs with the first test that needs one." This is
    # that test. tests/questionnaire_e2e_flow_test.ts skips itself silently
    # when DATABASE_URL is unset, so without this service the one case that
    # crosses a stage boundary would report green having never run.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          # Ephemeral localhost-only CI database: trust auth, no password to
          # hardcode (avoids committing a credential-looking literal).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Local Postgres service (TLS auto-disabled for localhost in lib/db.ts).
      DATABASE_URL: postgres://postgres@localhost:5432/test_db
      BASE_URL: http://localhost:8393
      DENO_ENV: test
      # Non-secret CI-only dummy values (no real credentials). This is the
      # minimum set the test paths below actually read, verified by running
      # them under `env -i` with exactly these and nothing else.
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0
      RESUME_TOKEN_SECRET: ci-only-resume-secret-not-for-production
      SESSION_SECRET: ci-only-session-secret-not-for-production
      ENCRYPTION_KEY: ci-only-encryption-key-32bytes-padding0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The pre-commit hook runs this script with no arguments, which examines
      # only the lines a commit ADDS. That is a ratchet and cannot see what is
      # already committed: routes/auth/verify.tsx interpolated two session ids
      # and a raw error object into console.warn for its entire life while the
      # hook passed cleanly on every commit, because those lines were never
      # again part of a diff. --all reads every tracked source file, which is
      # the only mode that can answer the question CLAUDE.md actually asks.
      #
      # No path scoping here, unlike the steps below: a leak is a leak wherever
      # it is, and the script keeps its own exclusion list for generated
      # bundles and unshipped trees.
      - name: Zero-logging policy
        run: bash scripts/check-zero-logging.sh --all

      # The service above starts an EMPTY database. Without this the DB-backed
      # test fails on a missing table rather than on anything it means to
      # assert. migrate.ts prefers .env, which is gitignored and therefore
      # absent here, so it falls through to the environment above. It runs
      # after the cheap static check, so a logging regression fails in seconds
      # rather than behind a database bring-up.
      - name: Apply migrations
        run: deno run --allow-net --allow-env --allow-read migrate.ts
      # Scope note: `deno task test` cannot run repo-wide. `tests/` and `trash/`
      # carry ~449 pre-existing type errors (Jest globals, missing drizzle-orm)
      # that predate this workflow and fail before any test executes. The paths
      # below are the maintained Fresh application. Widen them as other areas are
      # fixed; do not widen to the whole repo without fixing those errors first.
      - name: Format check
        run: deno fmt --check data/ components/ routes/about.tsx routes/shop.tsx routes/about/

      - name: Type check
        run: |
          # main.ts is the production entrypoint: if it does not type check, the
          # service cannot boot. It was missing from this list when e27764a merged
          # `import { initPool } from './lib/db.ts'` — a symbol lib/db.ts has never
          # exported. Nothing caught it, and nothing could: the deployed process had
          # started before that commit was checked out, so it kept serving old code
          # and the break stayed invisible for two days, until a routine restart
          # crash-looped the site into 502. Keep main.ts first in this list.
          #
          # deliver.ts and romania-client.ts are here for a related reason: the
          # DeliveryBundle interface omitted keyId while buildBundle returned it,
          # so the two halves of the wire contract disagreed and only a type check
          # could say so. The tests below run without --no-check and would catch it
          # too; naming the pair explicitly keeps the guard if those paths move.
          deno check \
            main.ts \
            data/shop.ts \
            components/PageShell.tsx \
            routes/about.tsx \
            routes/shop.tsx \
            routes/about/confession-albums.tsx \
            routes/about/respondents.tsx \
            routes/api/responses/deliver.ts \
            lib/romania-client.ts

      # islands/ carries Nav_test, whose `PAGE_NAV points at nothing that does
      # not exist` case is the guard against a nav link to a page that is not
      # routed -- the failure a retired menu already shipped once, linking three
      # routes to a /lotto.html that never existed. It was passing locally and
      # running nowhere, so the guard could not have stopped a repeat.
      #
      # public/js/ carries seal-guards_test, which exercises the envelope bounds
      # every sealing surface depends on: a hostile iteration count, an oversized
      # field decoded before it is inspected, an empty passphrase that seals
      # nothing. They are pure functions, so they run without a DOM.
      #
      # Note these are added to the test step ONLY. islands/ is not fmt-clean --
      # QuaternarySpheroid.tsx and Spheroid.tsx predate the singleQuote setting, so
      # widening `deno fmt --check` to it would fail on drift no one here
      # introduced. Format those two, then widen the fmt step separately.
      #
      # The three tests/ files are named individually, NOT as `tests/`: the rest
      # of that directory carries the pre-existing type errors described above,
      # and `deno test` type checks before it runs anything. These three are
      # clean, so they run without --no-check and get the type check for free.
      # The e2e one is the only test in the repo that crosses a stage boundary,
      # and it is the reason the Postgres service exists.
      - name: Test
        run: |
          deno test --allow-env --allow-read --allow-net \
            data/ \
            components/ \
            islands/ \
            public/js/ \
            lib/csrf_test.ts \
            routes/shop_test.tsx \
            routes/about_test.tsx \
            routes/about/ \
            tests/deliver_bundle_test.ts \
            tests/session_supersede_test.ts \
            tests/questionnaire_e2e_flow_test.ts
