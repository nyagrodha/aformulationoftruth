name: CI

# The site is a Deno Fresh application. The previous pipeline ran `npm ci`
# against an Express server (`backend/`) that has since been deleted, watched
# branches (main, develop) that are not the deploy branch, and had been failing
# on every run. This replaces it with checks against the code that actually ships.

on:
  push:
    branches: [production, main]
  pull_request:
    branches: [production, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Scope note: do not run `deno task test` repo-wide. tests/questionnaire_e2e_test.ts,
      # tests/newsletter_test.ts and tests/contact_test.ts open a live server
      # (TEST_BASE_URL). Everything listed below is hermetic: no Postgres, no
      # SMTP, no key box. Widen those live suites only with a server fixture.
      - name: Format check
        run: deno fmt --check data/ components/ routes/about.tsx routes/shop.tsx routes/about/

      - name: Type check
        run: |
          # main.ts is the production entrypoint: if it does not type check, the
          # service cannot boot. It was missing from this list when e27764a merged
          # `import { initPool } from './lib/db.ts'` — a symbol lib/db.ts has never
          # exported. Nothing caught it, and nothing could: the deployed process had
          # started before that commit was checked out, so it kept serving old code
          # and the break stayed invisible for two days, until a routine restart
          # crash-looped the site into 502. Keep main.ts first in this list.
          deno check \
            main.ts \
            lib/*.ts \
            routes/api/*.ts \
            romania/*.ts \
            data/shop.ts \
            components/PageShell.tsx \
            routes/about.tsx \
            routes/shop.tsx \
            routes/about/confession-albums.tsx \
            routes/about/respondents.tsx

      # islands/ carries Nav_test, whose `PAGE_NAV points at nothing that does
      # not exist` case is the guard against a nav link to a page that is not
      # routed -- the failure a retired menu already shipped once, linking three
      # routes to a /lotto.html that never existed. It was passing locally and
      # running nowhere, so the guard could not have stopped a repeat. Same for
      # messenger_test, which pins the messenger's "no server plaintext" claim by
      # asserting its script has no way to reach the network.
      #
      # lib/, routes/api/ and romania/ are the encryption and questionnaire
      # path: age recipients, fail-closed gate submit, session keys, PDF
      # bundle shape, keystore shred clocks. romania/tests/render_test.ts and
      # protect_test.ts SKIP (loudly) when typst/qpdf are absent, which they
      # are on this runner; keystore and validateBundle still run.
      #
      # --allow-write/--allow-run: lib/email_test.ts shells out to send_mail.py;
      # romania/tests/keystore_test.ts writes temp key files.
      #
      # Note islands/ is not fmt-clean -- QuaternarySpheroid.tsx and Spheroid.tsx
      # predate the singleQuote setting, so widening `deno fmt --check` to it
      # would fail on drift no one here introduced. Format those two, then
      # widen the fmt step separately.
      - name: Test
        run: |
          deno test --allow-env --allow-read --allow-net --allow-write --allow-run \
            data/ \
            components/ \
            islands/ \
            lib/ \
            romania/ \
            routes/shop_test.tsx \
            routes/about_test.tsx \
            routes/messenger_test.tsx \
            routes/about/ \
            routes/api/gate-submit_test.ts \
            routes/api/auth/magic-link_test.ts \
            tests/age_encrypt_test.ts \
            tests/session_keys_test.ts \
            tests/gate_submit_keys_test.ts \
            tests/answer_recipients_test.ts \
            tests/deliver_bundle_test.ts \
            tests/integration_test.ts \
            tests/resume_notice_test.tsx \
            tests/completion_consent_test.tsx

  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The gate crate's tests pin multi-recipient age encryption: both the
      # session identity and the break-glass identity must open the same
      # ciphertext, and an empty recipient list must be refused. They do not
      # need Postgres.
      - name: Test gate
        working-directory: rust-server
        run: cargo test --locked
