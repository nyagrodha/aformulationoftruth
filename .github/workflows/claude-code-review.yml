name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write so GITHUB_TOKEN can post the review when the OIDC app-token
      # exchange is skipped (Copilot-opened PRs). Human-opened PRs still use
      # the Claude GitHub App token from OIDC.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cursor/Copilot-opened PRs set github.actor to Copilot, which is not
          # a GitHub user. Anthropic's OIDC exchange then 401s ("User does not
          # have write access") before allowed_bots is consulted. Pass the job
          # token only for that actor so the exchange is skipped; human-opened
          # PRs keep the empty override and still mint the Claude app token.
          # See anthropics/claude-code-action#1017.
          github_token: ${{ github.actor == 'Copilot' && secrets.GITHUB_TOKEN || '' }}
          allowed_bots: 'Copilot,cursor[bot]'
          allowed_non_write_users: 'Copilot'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
